<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>12V Battery Runtime Calculator</title>
  <style>
    :root {
      --bg: #0b1329;
      --card: #1e293b;
      --input-bg: #0f172a;
      --border: #334155;
      --primary: #38bdf8;
      --accent: #22c55e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 14px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.4rem;
      color: #fff;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 16px prevents iOS Safari auto-zoom and input lock */
    input, select {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Stacked Appliance Card Design for Mobile */
    .appliance-item {
      background: #131f37;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .appliance-top {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-add {
      background: transparent;
      border: 2px dashed var(--primary);
      color: var(--primary);
      padding: 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    /* Results */
    .hero-stat {
      background: #0f1c33;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .hero-val {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 4px;
    }

    .hero-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini-stat {
      background: #0f1c33;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .mini-stat .val {
      font-size: 1.15rem;
      font-weight: 600;
      color: #fff;
      margin-top: 2px;
    }

    .mini-stat .lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .solar-box {
      background: #0f2744;
      border: 1px solid var(--primary);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>12V Battery Runtime Tool</h1>
      <p>Instant off-grid battery endurance & solar sizing</p>
    </header>

    <!-- 1. BATTERY SETUP -->
    <div class="card">
      <div class="card-title">1. Battery Setup</div>
      
      <div class="field">
        <label>Battery Chemistry</label>
        <select id="chem">
          <option value="0.90" selected>LiFePO4 Lithium (90% usable)</option>
          <option value="0.50">AGM / Deep Cycle (50% usable)</option>
          <option value="0.80">Gel Battery (80% usable)</option>
        </select>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Capacity (Amp Hours)</label>
          <input type="number" id="capacity" value="100" inputmode="numeric" />
        </div>
        <div class="field">
          <label>Inverter Eff. (%)</label>
          <input type="number" id="inverterEff" value="88" inputmode="numeric" />
        </div>
      </div>
    </div>

    <!-- 2. APPLIANCES -->
    <div class="card">
      <div class="card-title">2. Connected Loads</div>
      
      <div id="appliances-container" style="display:flex; flex-direction:column; gap:12px;">
        
        <!-- Default Item 1 -->
        <div class="appliance-item">
          <div class="appliance-top">
            <input type="text" value="12V Fridge" placeholder="Appliance name" class="app-name" />
            <button type="button" class="btn-delete" onclick="removeRow(this)">Delete</button>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Power Draw (Watts)</label>
              <input type="number" value="45" class="app-watts" inputmode="numeric" />
            </div>
            <div class="field">
              <label>Run Profile</label>
              <select class="app-duty">
                <option value="0.35" selected>Cycling (35%)</option>
                <option value="0.50">Heavy (50%)</option>
                <option value="1.0">Always On (100%)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Default Item 2 -->
        <div class="appliance-item">
          <div class="appliance-top">
            <input type="text" value="Phone / USB Charging" placeholder="Appliance name" class="app-name" />
            <button type="button" class="btn-delete" onclick="removeRow(this)">Delete</button>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>Power Draw (Watts)</label>
              <input type="number" value="18" class="app-watts" inputmode="numeric" />
            </div>
            <div class="field">
              <label>Run Profile</label>
              <select class="app-duty">
                <option value="0.25">Short (25%)</option>
                <option value="0.50" selected>Half-Day (50%)</option>
                <option value="1.0">Always On (100%)</option>
              </select>
            </div>
          </div>
        </div>

      </div>

      <button type="button" class="btn-add" onclick="addApplianceRow()">+ Add Another Appliance</button>
    </div>

    <!-- 3. RESULTS -->
    <div class="card">
      <div class="card-title">3. Estimated Runtime</div>

      <div class="hero-stat">
        <div class="hero-sub" style="text-transform: uppercase;">Continuous Runtime</div>
        <div class="hero-val" id="runtime-display">-- hrs</div>
        <div class="hero-sub" id="days-display" style="margin-top: 4px;">--</div>
      </div>

      <div class="stat-row">
        <div class="mini-stat">
          <div class="lbl">Usable Energy</div>
          <div class="val" id="usable-wh">-- Wh</div>
        </div>
        <div class="mini-stat">
          <div class="lbl">Avg Current Draw</div>
          <div class="val" id="avg-amps">-- A</div>
        </div>
      </div>

      <div class="solar-box" id="solar-advice">
        Enter loads above to see solar panel recommendations.
      </div>
    </div>
  </div>

  <script>
    function calculate() {
      const chemDod = parseFloat(document.getElementById('chem').value);
      const capacityAh = parseFloat(document.getElementById('capacity').value) || 0;
      const inverterEff = (parseFloat(document.getElementById('inverterEff').value) || 88) / 100;
      const nominalVoltage = 12.8;

      const totalWh = capacityAh * nominalVoltage;
      const usableWh = totalWh * chemDod;

      let totalAverageWatts = 0;
      const rows = document.querySelectorAll('.appliance-item');

      rows.forEach(row => {
        const watts = parseFloat(row.querySelector('.app-watts').value) || 0;
        const duty = parseFloat(row.querySelector('.app-duty').value) || 1.0;
        totalAverageWatts += (watts * duty);
      });

      const adjustedWatts = totalAverageWatts / inverterEff;
      const averageAmps = adjustedWatts / nominalVoltage;

      const runtimeHours = adjustedWatts > 0 ? (usableWh / adjustedWatts) : 0;
      const runtimeDays = runtimeHours / 24;

      document.getElementById('runtime-display').textContent = runtimeHours > 0 ? `${runtimeHours.toFixed(1)} hrs` : '∞ hrs';
      document.getElementById('days-display').textContent = runtimeHours > 0 ? `(~${runtimeDays.toFixed(1)} days off-grid)` : 'No active load entered';
      document.getElementById('usable-wh').textContent = `${Math.round(usableWh)} Wh`;
      document.getElementById('avg-amps').textContent = `${averageAmps.toFixed(1)} A @ 12V`;

      const dailyWh = adjustedWatts * 24;
      const requiredSolarWatts = Math.round(dailyWh / (4.5 * 0.75));

      document.getElementById('solar-advice').innerHTML = adjustedWatts > 0
        ? `To run this setup indefinitely with 4.5 peak sun hours/day, you need roughly <strong>${requiredSolarWatts}W</strong> of solar panels to replace the daily <strong>${Math.round(dailyWh)} Wh</strong> draw.`
        : `Enter appliance loads above to calculate runtime and solar requirements.`;
    }

    function addApplianceRow() {
      const container = document.getElementById('appliances-container');
      const div = document.createElement('div');
      div.className = 'appliance-item';
      div.innerHTML = `
        <div class="appliance-top">
          <input type="text" placeholder="Device name" class="app-name" />
          <button type="button" class="btn-delete" onclick="removeRow(this)">Delete</button>
        </div>
        <div class="grid-2">
          <div class="field">
            <label>Power Draw (Watts)</label>
            <input type="number" value="30" class="app-watts" inputmode="numeric" />
          </div>
          <div class="field">
            <label>Run Profile</label>
            <select class="app-duty">
              <option value="0.25">Short (25%)</option>
              <option value="0.50">Half-Day (50%)</option>
              <option value="1.0" selected>Always On (100%)</option>
            </select>
          </div>
        </div>
      `;
      container.appendChild(div);
      attachListeners();
      calculate();
    }

    function removeRow(btn) {
      btn.closest('.appliance-item').remove();
      calculate();
    }

    function attachListeners() {
      document.querySelectorAll('input, select').forEach(element => {
        element.removeEventListener('input', calculate);
        element.addEventListener('input', calculate);
      });
    }

    attachListeners();
    calculate();
  </script>
</body>
</html>
